<!DOCTYPE html>
<html lang="pt" data-bs-theme="dark" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css" />
    <link rel="stylesheet" th:href="@{/css/style_list_manual.css}">
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
    <title>List Tasks</title>
</head>

<body>
    <div class="navbar navbar-expand-md navbar-dark d-print-none sticky-top">
        <div class="container-xl">
            <h1 class="navbar-brand navbar-brand-autodark">
                Minhas Tarefas
            </h1>
            <div class="navbar-nav flex-row order-md-last">
                <a href="#" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalCriarTask">
                    <svg xmlns="http://www.w3.org/2000/svg" class="icon" width="24" height="24" viewBox="0 0 24 24"
                        stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                        <line x1="12" y1="5" x2="12" y2="19" />
                        <line x1="5" y1="12" x2="19" y2="12" />
                    </svg>
                    Nova Tarefa
                </a>
            </div>
        </div>
    </div>
    <div class="container-xl mt-4">
        <div class="cards-container">
            <div class="card" th:each="task : ${tasks}">
                <div class="card-header">
                    <h3 class="card-title" th:text="${task.titulo}"></h3>
                </div>
                <div class="card-body">
                    <p class="text-secondary">
                        <strong><span>Descrição:</span></strong>
                        <span th:text="${task.descricao}"></span>
                    </p>
                    <p class="text-secondary">
                        <strong><span>Status:</span></strong>
                        <span th:text="${task.status}"></span>
                    </p>
                    <p class="text-secondary">
                        <strong><span>Prioridade:</span></strong>
                        <span th:text="${task.prioridade}"></span>
                    </p>
                    <p class="text-secondary">
                        <strong><span>Data de Criação:</span></strong>
                        <span th:text="${#temporals.format(task.dataCriacao, 'dd/MM/yyyy')}"></span>
                    </p>
                    <p th:if="${task.dataConclusao} != null" class="text-secondary">
                        <strong><span>Data de Conclusão:</span></strong>
                        <span th:text="${#temporals.format(task.dataConclusao, 'dd/MM/yyyy')}"></span>
                    </p>
                    <p class="text-secondary">
                        <strong><span>Data de Finalização(Previsão):</span></strong>
                        <span th:text="${#temporals.format(task.dataFinalizacao, 'dd/MM/yyyy')}"></span>
                    </p>
                    <div class="mt-3 d-flex gap-2">
                        <a href="#" class="btn btn-outline-primary btn-sm" data-bs-toggle="modal"
                            th:attr="data-bs-target='#modalEditar-' + ${task.id}">Editar</a>
                        <form th:action="@{/todolist/concluir/{id}(id=${task.id})}" method="post">
                            <button type="submit" class="btn btn-outline-success btn-sm">Concluir</button>
                        </form>
                        <form th:action="@{/todolist/deletar/{id}(id=${task.id})}" method="post">
                            <button type="submit" class="btn btn-outline-danger btn-sm">Deletar</button>
                        </form>
                    </div>
                </div>
                <!-- MODAL UPDATE-->
                <div class="modal fade" th:id="'modalEditar-' + ${task.id}" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title">Editar Tarefa</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                            </div>
                            <div class="modal-body">
                                <form th:action="@{/todolist/editar/{id}(id=${task.id})}" method="post">
                                    <div class="mb-3">
                                        <label class="form-label">Título</label>
                                        <input type="text" class="form-control" name="titulo"
                                            th:value="${task.titulo}" />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Descrição</label>
                                        <input type="text" class="form-control" name="descricao"
                                            th:value="${task.descricao}" />
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Status</label>
                                        <select class="form-select" name="status">
                                            <option value="PENDENTE" th:selected="${task.status == 'PENDENTE'}">Pendente
                                            </option>
                                            <option value="CONCLUIDA" th:selected="${task.status == 'CONCLUIDA'}">
                                                Concluída</option>
                                            <option value="EM_ANDAMENTO" th:selected="${task.status == 'EM_ANDAMENTO'}">
                                                Em andamento</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Prioridade</label>
                                        <select class="form-select" name="prioridade">
                                            <option value="BAIXA" th:selected="${task.prioridade == 'BAIXA'}">Baixa
                                            </option>
                                            <option value="MEDIA" th:selected="${task.prioridade == 'MEDIA'}">Média
                                            </option>
                                            <option value="ALTA" th:selected="${task.prioridade == 'ALTA'}">Alta
                                            </option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label">Data de Finalização</label>
                                        <input type="date" class="form-control" name="dataFinalizacao"
                                            th:value="${task.dataFinalizacao}" />
                                    </div>
                                    <input type="hidden" name="dataCriacao" th:value="${task.dataCriacao}" />
                                    <div class="modal-footer">
                                        <button type="button" class="btn btn-secondary"
                                            data-bs-dismiss="modal">Cancelar</button>
                                        <button type="submit" class="btn btn-primary">Salvar</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <!-- MODAL CRIAR -->
            <div class="modal fade" id="modalCriarTask" tabindex="-1">
                <div class="modal-dialog">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Nova Tarefa</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <form th:action="@{/todolist/criar}" th:object="${taskForm}" method="post">
                                <div class="mb-3">
                                    <label class="form-label">Título</label>
                                    <input type="text" class="form-control" placeholder="Título da tarefa"
                                        th:field="*{titulo}" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Descrição</label>
                                    <input type="text" class="form-control" placeholder="Descrição da tarefa"
                                        th:field="*{descricao}" />
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Prioridade</label>
                                    <select class="form-select" th:field="*{prioridade}">
                                        <option value="">Selecione a prioridade</option>
                                        <option value="BAIXA">Baixa</option>
                                        <option value="MEDIA">Média</option>
                                        <option value="ALTA">Alta</option>
                                    </select>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Data de Finalização</label>
                                    <input type="date" class="form-control" th:field="*{dataFinalizacao}" />
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary"
                                        data-bs-dismiss="modal">Cancelar</button>
                                    <button type="submit" class="btn btn-primary">Criar</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
